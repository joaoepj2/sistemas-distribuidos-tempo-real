# Redis com replicação e failover automático via Sentinel
# 1 primário + 2 réplicas + 3 Sentinels, todos na rede "sdtr-redis".
#
# Subir:      cp .env.example .env && docker compose up -d
# Ver estado: docker compose ps
# Zerar tudo: docker compose down -v
#
# Testado em 10/11/2026 no macOS (versão sem IPs fixos) e em 25/11/2026 no
# Windows (versão atual, com IPs fixos e tabela de nomes).

name: sdtr-redis

# Tabela de nomes fixa (vira o /etc/hosts de cada contêiner).
# Por que existe: quando um contêiner é PARADO, o nome dele some do DNS do
# Docker. No Docker Desktop do Windows a consulta por um nome inexistente
# leva de 3 a 4 segundos para falhar (o DNS interno repassa a pergunta ao
# resolvedor do host). O Sentinel e o Redis resolvem nomes de forma
# BLOQUEANTE, numa única thread: cada consulta trava o processo inteiro.
# Travado por mais de 2 s, o Sentinel entra em "modo TILT" e não faz failover.
# Com esta tabela o nome é resolvido na hora, sem passar pelo DNS, em
# qualquer sistema. Os IPs batem com os "ipv4_address" de cada serviço.
x-nomes: &nomes
  - "redis-primario:172.30.89.11"
  - "redis-replica1:172.30.89.12"
  - "redis-replica2:172.30.89.13"
  - "sentinel1:172.30.89.21"
  - "sentinel2:172.30.89.22"
  - "sentinel3:172.30.89.23"

# Configuração comum aos 3 nós Redis (âncora YAML reaproveitada abaixo)
x-redis-node: &redis-node
  image: ${REDIS_IMAGE}
  restart: unless-stopped
  extra_hosts: *nomes
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 5
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD}

# Configuração comum aos 3 Sentinels
x-sentinel: &sentinel
  image: ${REDIS_IMAGE}
  restart: unless-stopped
  extra_hosts: *nomes
  entrypoint: ["sh", "/usr/local/bin/sentinel-entrypoint.sh"]
  depends_on:
    redis-primario:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 5

services:
  # ---------------------------------------------------------------- nós Redis
  redis-primario:
    <<: *redis-node
    container_name: redis-primario
    hostname: redis-primario
    networks:
      sdtr-redis: { ipv4_address: 172.30.89.11 }
    # --requirepass  : senha para clientes
    # --masterauth   : senha usada quando ESTE nó virar réplica (após um failover)
    # --appendonly   : grava cada escrita em disco (AOF) para sobreviver a reinícios
    # --replica-announce-ip : se anuncia pelo nome, não pelo IP (IPs mudam ao reiniciar)
    command: >
      redis-server --port 6379
      --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
      --appendonly yes
      --replica-announce-ip redis-primario
    ports: ["6380:6379"]
    volumes: [dados-primario:/data]

  redis-replica1:
    <<: *redis-node
    container_name: redis-replica1
    hostname: redis-replica1
    networks:
      sdtr-redis: { ipv4_address: 172.30.89.12 }
    # --replicaof : começa como cópia do primário (somente leitura)
    command: >
      redis-server --port 6379
      --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
      --appendonly yes
      --replica-announce-ip redis-replica1
      --replicaof redis-primario 6379
    ports: ["6381:6379"]
    volumes: [dados-replica1:/data]
    depends_on:
      redis-primario: { condition: service_healthy }

  redis-replica2:
    <<: *redis-node
    container_name: redis-replica2
    hostname: redis-replica2
    networks:
      sdtr-redis: { ipv4_address: 172.30.89.13 }
    command: >
      redis-server --port 6379
      --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
      --appendonly yes
      --replica-announce-ip redis-replica2
      --replicaof redis-primario 6379
    ports: ["6382:6379"]
    volumes: [dados-replica2:/data]
    depends_on:
      redis-primario: { condition: service_healthy }

  # ---------------------------------------------------------------- Sentinels
  # Três Sentinels para haver maioria (quórum 2 de 3) mesmo com um fora do ar.
  sentinel1:
    <<: *sentinel
    container_name: sentinel1
    hostname: sentinel1
    networks:
      sdtr-redis: { ipv4_address: 172.30.89.21 }
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENTINEL_MASTER_NAME: ${SENTINEL_MASTER_NAME}
      SENTINEL_HOSTNAME: sentinel1
    ports: ["26380:26379"]
    volumes:
      - ./sentinel/sentinel.conf.template:/etc/redis/sentinel.conf.template:ro
      - ./sentinel/entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
      - ./demo:/demo:ro                 # scripts da demonstração
      - dados-sentinel1:/data

  sentinel2:
    <<: *sentinel
    container_name: sentinel2
    hostname: sentinel2
    networks:
      sdtr-redis: { ipv4_address: 172.30.89.22 }
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENTINEL_MASTER_NAME: ${SENTINEL_MASTER_NAME}
      SENTINEL_HOSTNAME: sentinel2
    ports: ["26381:26379"]
    volumes:
      - ./sentinel/sentinel.conf.template:/etc/redis/sentinel.conf.template:ro
      - ./sentinel/entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
      - dados-sentinel2:/data

  sentinel3:
    <<: *sentinel
    container_name: sentinel3
    hostname: sentinel3
    networks:
      sdtr-redis: { ipv4_address: 172.30.89.23 }
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENTINEL_MASTER_NAME: ${SENTINEL_MASTER_NAME}
      SENTINEL_HOSTNAME: sentinel3
    ports: ["26382:26379"]
    volumes:
      - ./sentinel/sentinel.conf.template:/etc/redis/sentinel.conf.template:ro
      - ./sentinel/entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
      - dados-sentinel3:/data

networks:
  sdtr-redis:
    name: sdtr-redis
    # Faixa fixa, necessária para os IPs da tabela x-nomes.
    # Se ela coincidir com a rede da sua casa ou da sala (raro), troque o
    # "172.30.89" aqui, nos ipv4_address e na tabela x-nomes.
    ipam:
      config:
        - subnet: 172.30.89.0/24

volumes:
  dados-primario:
  dados-replica1:
  dados-replica2:
  dados-sentinel1:
  dados-sentinel2:
  dados-sentinel3:
